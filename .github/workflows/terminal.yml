name: terminal-bridge

on:
  push:
    branches: [main]
    paths:
      - ".terminal/command"

permissions:
  contents: write

jobs:
  terminal:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute allowed operation
        shell: bash
        run: |
          set +e
          op="$(tr -d '\r\n' < .terminal/command)"

          {
            echo "=== terminal bridge ==="
            echo "time: $(date -Is)"
            echo "host: $(hostname)"
            echo "user: $(whoami)"
            echo
            echo "=== operation ==="
            printf '%s\n' "$op"
            echo
            echo "=== output ==="

            case "$op" in
              # Host / OS
              host_info)
                hostnamectl 2>/dev/null || hostname
                uname -a
                uptime
                ;;
              os_release)
                cat /etc/os-release
                ;;
              memory)
                free -h
                ;;
              disk)
                df -hT
                ;;
              disk_usage)
                du -xhd1 / 2>/dev/null | sort -h
                ;;
              mounts)
                findmnt
                ;;
              processes)
                ps aux --sort=-%cpu | head -30
                ;;
              load)
                cat /proc/loadavg
                uptime
                ;;

              # Network
              interfaces)
                ip -br addr
                ;;
              routes)
                ip route
                ;;
              neighbors)
                ip neigh
                ;;
              ports)
                ss -lntup
                ;;
              sockets)
                ss -s
                ;;
              dns)
                resolvectl status 2>/dev/null || cat /etc/resolv.conf
                ;;
              public_ip)
                curl -4fsS --max-time 10 https://api.ipify.org
                echo
                ;;
              ufw_status)
                sudo -n ufw status verbose
                ;;
              ufw_numbered)
                sudo -n ufw status numbered
                ;;

              # Docker
              docker_ps)
                docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
                ;;
              docker_all)
                docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
                ;;
              docker_images)
                docker images
                ;;
              docker_volumes)
                docker volume ls
                ;;
              docker_networks)
                docker network ls
                ;;
              docker_disk)
                docker system df
                ;;
              docker_info)
                docker info
                ;;
              docker_events)
                timeout 10 docker events --since 10s
                ;;

              # Kubernetes
              k8s_nodes)
                kubectl get nodes -o wide
                ;;
              k8s_pods)
                kubectl get pods -A -o wide
                ;;
              k8s_services)
                kubectl get svc -A
                ;;
              k8s_deployments)
                kubectl get deployments -A
                ;;
              k8s_statefulsets)
                kubectl get statefulsets -A
                ;;
              k8s_daemonsets)
                kubectl get daemonsets -A
                ;;
              k8s_ingresses)
                kubectl get ingress -A
                ;;
              k8s_pv)
                kubectl get pv
                ;;
              k8s_pvc)
                kubectl get pvc -A
                ;;
              k8s_endpoints)
                kubectl get endpoints -A
                ;;
              k8s_endpointslices)
                kubectl get endpointslices -A
                ;;
              k8s_namespaces)
                kubectl get namespaces
                ;;
              k8s_events)
                kubectl get events -A --sort-by=.lastTimestamp
                ;;
              k8s_cluster_info)
                kubectl cluster-info
                ;;
              k8s_version)
                kubectl version
                ;;
              k8s_api_resources)
                kubectl api-resources
                ;;
              k8s_context)
                kubectl config current-context
                ;;
              k8s_crds)
                kubectl get crd
                ;;

              # Systemd / services
              systemd_failed)
                systemctl --failed --no-pager
                ;;
              systemd_units)
                systemctl list-units --type=service --state=running --no-pager
                ;;
              nginx_status)
                sudo -n systemctl status nginx --no-pager 2>&1
                ;;
              nginx_config_test)
                sudo -n nginx -t
                ;;
              nginx_listening)
                ss -lntp | grep -E ':(80|443)\\b' || true
                ;;
              kubelet_status)
                sudo -n systemctl status kubelet --no-pager 2>&1
                ;;
              containerd_status)
                sudo -n systemctl status containerd --no-pager 2>&1
                ;;
              ssh_status)
                sudo -n systemctl status ssh --no-pager 2>&1
                ;;
              panel_status)
                sudo -n systemctl status oneslash-panel --no-pager 2>&1
                ;;

              # Application / bridge
              panel_health)
                curl -fsS http://127.0.0.1:8090/api/health
                ;;
              ai_chat_health)
                curl -fsS http://127.0.0.1:8080/health
                ;;
              ai_chat_config)
                curl -fsS http://127.0.0.1:8080/config
                ;;
              ai_chat_root)
                curl -fsSI http://127.0.0.1:8080/
                ;;
              ai_chat_logs)
                docker logs --tail 100 ai-chat
                ;;
              private_proxy_logs)
                docker logs --tail 100 private-proxy
                ;;
              private_proxy_status)
                docker inspect --format '{{.Status}}' private-proxy 2>&1
                ;;

              # Kubernetes / CNI diagnostics
              calico_pods)
                kubectl get pods -A -o wide | grep -i calico || true
                ;;
              kube_system)
                kubectl get pods -n kube-system -o wide
                ;;
              kube_system_services)
                kubectl get svc -n kube-system
                ;;

              # Filesystem / security diagnostics
              whoami)
                id
                groups
                ;;
              environment)
                env | sort
                ;;
              time)
                date -Is
                ;;
              kernel)
                uname -a
                ;;
              sudo_check)
                sudo -n -l 2>&1
                ;;
              cron)
                crontab -l 2>&1
                ;;
              disk_inodes)
                df -ih
                ;;

              # Web chat deployment
              deploy_web_chat)
                set -e
                mkdir -p /home/ivan/oneslash-chat/data
                cat > /home/ivan/oneslash-chat/app.py <<'PY'
import json
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
from pathlib import Path

ROOT = Path('/data')
QUESTION = ROOT / 'question.json'
ANSWER = ROOT / 'answer.json'
ROOT.mkdir(parents=True, exist_ok=True)

HTML = r'''<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oneslash Chat</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 16px;background:#111;color:#eee}.box{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:16px}#messages{min-height:300px;max-height:60vh;overflow:auto;margin-bottom:12px}.m{padding:10px 12px;margin:8px 0;border-radius:10px;background:#252525;white-space:pre-wrap}.me{background:#303b4a}.muted{color:#999;font-size:13px}form{display:flex;gap:8px}textarea{flex:1;resize:vertical;min-height:52px;background:#111;color:#eee;border:1px solid #444;border-radius:8px;padding:10px}button{background:#eee;color:#111;border:0;border-radius:8px;padding:0 18px;font-weight:600;cursor:pointer}</style></head>
<body><h1>Oneslash Chat</h1><div class="box"><div id="messages"><div class="muted">Напиши вопрос. После команды «забери новый вопрос» ответ появится здесь.</div></div><form id="f"><textarea id="q" placeholder="Напиши сообщение..."></textarea><button>Отправить</button></form></div>
<script>
const box=document.querySelector('#messages'),q=document.querySelector('#q');let lastAnswer='';
function add(text,cls){const d=document.createElement('div');d.className='m '+(cls||'');d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}
document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const text=q.value.trim();if(!text)return;add(text,'me');q.value='';try{const r=await fetch('/api/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text})});const j=await r.json();if(j.status!=='queued')add('Ошибка: '+(j.error||'unknown'));}catch(err){add('Ошибка соединения: '+err)}};
async function poll(){try{const r=await fetch('/api/answer?ts='+Date.now());if(!r.ok)return;const j=await r.json();if(j.id&&j.id!==lastAnswer&&j.answer){lastAnswer=j.id;add(j.answer,'');}}catch(e){}}
setInterval(poll,2000);poll();
</script></body></html>'''

class Handler(BaseHTTPRequestHandler):
    def send_json(self, code, obj):
        data=json.dumps(obj,ensure_ascii=False).encode()
        self.send_response(code);self.send_header('Content-Type','application/json; charset=utf-8');self.send_header('Cache-Control','no-store');self.send_header('Content-Length',str(len(data)));self.end_headers();self.wfile.write(data)
    def do_GET(self):
        if self.path.startswith('/api/answer'):
            if ANSWER.exists():
                try: self.send_json(200,json.loads(ANSWER.read_text(encoding='utf-8')))
                except Exception: self.send_json(500,{'error':'invalid answer'})
            else: self.send_json(200,{})
            return
        if self.path=='/health': self.send_json(200,{'status':'ok','service':'oneslash-chat'});return
        if self.path=='/':
            data=HTML.encode();self.send_response(200);self.send_header('Content-Type','text/html; charset=utf-8');self.send_header('Content-Length',str(len(data)));self.end_headers();self.wfile.write(data);return
        self.send_json(404,{'error':'not found'})
    def do_POST(self):
        if self.path!='/api/message': self.send_json(404,{'error':'not found'});return
        try:
            n=int(self.headers.get('Content-Length','0'));body=json.loads(self.rfile.read(n));msg=str(body.get('message','')).strip()
            if not msg or len(msg)>10000:self.send_json(400,{'error':'message must be 1..10000 chars'});return
            import time,uuid
            q={'id':str(uuid.uuid4()),'message':msg,'created_at':time.time()}
            QUESTION.write_text(json.dumps(q,ensure_ascii=False),encoding='utf-8')
            ANSWER.unlink(missing_ok=True)
            self.send_json(202,{'status':'queued','id':q['id']})
        except Exception as e:self.send_json(400,{'error':str(e)})
    def log_message(self,*args):pass
ThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()
PY
                cat > /home/ivan/oneslash-chat/Dockerfile <<'EOF'
FROM python:3.12-alpine
WORKDIR /app
COPY app.py /app/app.py
RUN mkdir -p /data
EXPOSE 8080
CMD ["python","/app/app.py"]
EOF
                docker rm -f oneslash-chat 2>/dev/null || true
                docker build -t oneslash-chat:local /home/ivan/oneslash-chat
                docker run -d --name oneslash-chat --restart unless-stopped -p 31001:8080 -v /home/ivan/oneslash-chat/data:/data oneslash-chat:local
                curl -fsS http://127.0.0.1:31001/health
                ;;
              web_chat_get_question)
                set -e
                if [ -f /home/ivan/oneslash-chat/data/question.json ]; then
                  mkdir -p .chat
                  cp /home/ivan/oneslash-chat/data/question.json .chat/question.json
                  cat .chat/question.json
                else
                  echo '{"status":"empty"}'
                fi
                ;;
              web_chat_publish_answer)
                set -e
                mkdir -p /home/ivan/oneslash-chat/data
                test -f .chat/answer.json
                cp .chat/answer.json /home/ivan/oneslash-chat/data/answer.json
                cat /home/ivan/oneslash-chat/data/answer.json
                ;;
              web_chat_status)
                docker ps --filter name=^/oneslash-chat$ --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
                curl -fsS http://127.0.0.1:1080/health
                ;;
              web_chat_logs)
                docker logs --tail 100 oneslash-chat
                ;;

              *)
                echo "ERROR: operation not allowed"
                echo "Use one of the predefined operation names in .terminal/command."
                exit 2
                ;;
            esac

            rc=$?
            echo
            echo "=== exit code: $rc ==="
          } > .terminal/result 2>&1

      - name: Publish result
        shell: bash
        run: |
          git config user.name "terminal-bridge"
          git config user.email "terminal-bridge@users.noreply.github.com"
          git add .terminal/result
          git diff --cached --quiet && exit 0
          git commit -m "terminal: publish operation result [skip ci]"
          git push
