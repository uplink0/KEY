name: terminal-bridge

on:
  push:
    branches: [main]
    paths:
      - ".terminal/command"

permissions:
  contents: write

jobs:
  terminal:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute allowed operation
        shell: bash
        run: |
          set +e
          op="$(tr -d '\r\n' < .terminal/command)"
          {
            echo "=== terminal bridge ==="
            echo "time: $(date -Is)"
            echo "host: $(hostname)"
            echo "user: $(whoami)"
            echo
            echo "=== operation ==="
            printf '%s\n' "$op"
            echo
            echo "=== output ==="
            case "$op" in
              host_info) hostnamectl 2>/dev/null || hostname; uname -a; uptime ;;
              os_release) cat /etc/os-release ;;
              memory) free -h ;;
              disk) df -hT ;;
              web_chat_get_question)
                set -e
                if [ -f /home/ivan/oneslash-chat/data/question.json ]; then
                  mkdir -p .chat
                  cp /home/ivan/oneslash-chat/data/question.json .chat/question.json
                  cat .chat/question.json
                else
                  echo '{"status":"empty"}'
                fi
                ;;
              web_chat_publish_answer)
                set -e
                mkdir -p /home/ivan/oneslash-chat/data
                test -f .chat/answer.json
                cp .chat/answer.json /home/ivan/oneslash-chat/data/answer.json
                cat /home/ivan/oneslash-chat/data/answer.json
                ;;
              web_chat_status)
                docker ps --filter name=^/oneslash-chat$ --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
                curl -fsS http://127.0.0.1:31001/health
                ;;
              web_chat_logs) docker logs --tail 100 oneslash-chat ;;
              *) echo "ERROR: operation not allowed"; exit 2 ;;
            esac
            rc=$?
            echo
            echo "=== exit code: $rc ==="
          } > .terminal/result 2>&1

      - name: Publish result
        shell: bash
        run: |
          git config user.name "terminal-bridge"
          git config user.email "terminal-bridge@users.noreply.github.com"
          git add .terminal/result
          git diff --cached --quiet && exit 0
          git commit -m "terminal: publish operation result [skip ci]"
          git push