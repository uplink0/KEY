<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #6ea8fe;
      --user: #1f2937;
      --assistant: #18212f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .layout {
      width: min(960px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
    }

    .chat {
      flex: 1;
      min-height: 55vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 84%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }

    .message.error {
      align-self: stretch;
      background: #2a1515;
      color: #fecaca;
    }

    .composer {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    textarea {
      flex: 1;
      resize: vertical;
      min-height: 56px;
      max-height: 220px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text);
      background: var(--panel);
      outline: none;
      font: inherit;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: var(--accent);
      color: #08111f;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .layout { padding: 12px; }
      .composer { flex-direction: column; }
      button { min-height: 48px; }
      .message { max-width: 94%; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <header>
      <h1>AI Chat</h1>
      <div class="status" id="status">Проверка backend…</div>
    </header>

    <section class="chat" id="chat" aria-live="polite">
      <div class="message assistant">Готов. Напиши сообщение.</div>
    </section>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="Введите сообщение…" required></textarea>
      <button id="send" type="submit">Отправить</button>
    </form>

    <div class="hint">
      API-ключ хранится только на сервере и не передаётся в браузер.
    </div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    const history = [];

    function addMessage(role, text, extraClass = "") {
      const el = document.createElement("div");
      el.className = "message " + role + (extraClass ? " " + extraClass : "");
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    async function checkHealth() {
      try {
        const response = await fetch("/health");
        const data = await response.json();
        status.textContent = data.status === "ok" ? "Backend: OK" : "Backend: error";
      } catch {
        status.textContent = "Backend: недоступен";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      history.push({ role: "user", content: text });

      send.disabled = true;
      input.disabled = true;
      const pending = addMessage("assistant", "Думаю…");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Backend error");
        }

        pending.textContent = data.content;
        history.push({ role: "assistant", content: data.content });
      } catch (error) {
        pending.remove();
        addMessage("assistant", error.message, "error");
        history.pop();
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    checkHealth();
    input.focus();
  </script>
</body>
</html>
